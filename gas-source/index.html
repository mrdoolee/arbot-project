<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>아르봇(ARBOT) by 두리쌤</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --danger: #ef4444;
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color); color: var(--text-main);
      display: flex; justify-content: center; height: 100vh; overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    .app-container {
      width: 100%; max-width: 768px; height: 100%;
      background-color: var(--bg-color); display: flex; flex-direction: column;
      position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }
    .loading-overlay {
      position: absolute; inset: 0; background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(4px); display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 50;
      font-size: 1.1rem; font-weight: 600; color: var(--primary);
    }
    .spinner {
      border: 4px solid var(--border); border-top: 4px solid var(--primary);
      border-radius: 50%; width: 40px; height: 40px;
      animation: spin 1s linear infinite; margin-bottom: 16px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* 초기 설정 모달 */
    .screen-setup { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px; }
    .setup-card {
      background: var(--card-bg); width: 100%; max-width: 400px; padding: 32px 24px;
      border-radius: var(--radius); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    .setup-title { font-size: 1.5rem; font-weight: 700; text-align: center; margin-bottom: 24px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 0.95rem; font-weight: 600; margin-bottom: 8px; color: var(--text-muted); }
    select {
      width: 100%; padding: 14px; font-size: 1.05rem; border: 2px solid var(--border);
      border-radius: 12px; background-color: #f9fafb; outline: none; transition: all 0.2s;
    }
    select:focus { border-color: var(--primary); background-color: #fff; }
    .btn-start {
      width: 100%; padding: 16px; margin-top: 10px; font-size: 1.1rem; font-weight: bold;
      color: #fff; background-color: var(--primary); border: none; border-radius: 12px;
      cursor: pointer; transition: background 0.2s;
    }
    .btn-start:active { background-color: var(--primary-hover); transform: scale(0.98); }

    /* 대화창 화면 */
    .screen-chat { display: none; flex-direction: column; height: 100%; }
    header {
      background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px); padding: 16px 20px;
      display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); z-index: 10;
    }
    .header-info { font-size: 1rem; font-weight: 700; color: var(--text-main); }
    .header-sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }
    .timer-badge {
      background: var(--danger); color: #fff; padding: 6px 14px; border-radius: 20px;
      font-size: 0.95rem; font-weight: bold; font-family: monospace;
    }
    .chat-history { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    .msg {
      max-width: 85%; padding: 14px 18px; font-size: 1.05rem; line-height: 1.5;
      word-break: break-word; white-space: pre-wrap; box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .msg.ai { align-self: flex-start; background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 16px 16px 16px 4px; }
    .msg.user { align-self: flex-end; background-color: var(--primary); color: #fff; border-radius: 16px 16px 4px 16px; }
    .msg.system {
      align-self: center; max-width: 95%; background-color: #fef2f2; border: 1px solid #fecaca;
      color: #b91c1c; text-align: center; font-weight: bold; border-radius: 12px;
    }
    .input-area { background: var(--card-bg); padding: 16px; border-top: 1px solid var(--border); display: flex; gap: 12px; align-items: flex-end; }
    textarea {
      flex: 1; padding: 14px; font-size: 1.05rem; border: 2px solid var(--border);
      border-radius: 14px; background-color: #f9fafb; resize: none; height: 56px; outline: none;
    }
    textarea:focus { border-color: var(--primary); background-color: #fff; }
    .btn-send {
      width: 56px; height: 56px; background-color: var(--primary); color: white; border: none;
      border-radius: 14px; font-size: 1.5rem; cursor: pointer; display: flex; justify-content: center; align-items: center;
    }
    .btn-send:disabled, textarea:disabled { background-color: #d1d5db; border-color: #d1d5db; cursor: not-allowed; }
    .typing-indicator {
      display: none; align-self: flex-start; background-color: var(--card-bg);
      padding: 12px 18px; border-radius: 16px; border: 1px solid var(--border);
      color: var(--text-muted); font-size: 0.95rem; font-weight: 600; margin-bottom: 16px;
    }

    footer.copyright-footer { 
      text-align: center; 
      padding: 12px 16px; 
      font-size: 0.75rem; 
      color: #94a3b8; 
      background: var(--card-bg); 
      border-top: 1px solid var(--border); 
      width: 100%;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div id="loadingOverlay" class="loading-overlay">
      <div class="spinner"></div><div>수업 환경을 불러오는 중...</div>
    </div>

    <div id="screenSetup" class="screen-setup">
      <div class="setup-card">
        <div class="setup-title">🗣️ 아르봇(ARBOT)</div>
        <div class="form-group"><label>🔹 우리 학급</label><select id="selectClass"></select></div>
        <div class="form-group"><label>🔹 우리 모둠</label><select id="selectGroup"></select></div>
        <div class="form-group"><label>🔹 탐구 주제</label><select id="selectTopic"></select></div>
        <button id="btnStart" class="btn-start">논증 탐구 시작하기</button>
      </div>
    </div>

    <div id="screenChat" class="screen-chat">
      <header>
        <div><div id="headerInfo" class="header-info">-</div><div id="headerSub" class="header-sub">-</div></div>
        <div id="timerBadge" class="timer-badge">⏳ 00:00</div>
      </header>

      <div id="chatHistory" class="chat-history"></div>
      <div id="typingIndicator" class="typing-indicator" style="margin: 0 20px;">AI가 분석 중입니다...</div>

      <div class="input-area">
        <textarea id="userQuestion" placeholder="여기에 논증(주장, 근거 등)을 입력하세요..."></textarea>
        <button id="btnSend" class="btn-send">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </div>
    </div>
    <footer class="copyright-footer">
      © 2026 Designed & Developed by <strong>두리쌤</strong>. All rights reserved.
    </footer>
  </div> 
  </div>

  <script>
    let appConfig = { timeLimitMinutes: 20, classList: [], groupList: [], topicList: [] };
    let sessionData = { classValue: '', groupValue: '', topicValue: '', history: [] };
    let timerInterval = null, totalSeconds = 0, isSystemLocked = false;

    const DOM = {
      loading: document.getElementById('loadingOverlay'), setup: document.getElementById('screenSetup'),
      chat: document.getElementById('screenChat'), selClass: document.getElementById('selectClass'),
      selGroup: document.getElementById('selectGroup'), selTopic: document.getElementById('selectTopic'),
      btnStart: document.getElementById('btnStart'), hInfo: document.getElementById('headerInfo'),
      hSub: document.getElementById('headerSub'), timer: document.getElementById('timerBadge'),
      history: document.getElementById('chatHistory'), input: document.getElementById('userQuestion'),
      btnSend: document.getElementById('btnSend'), typing: document.getElementById('typingIndicator')
    };

    window.addEventListener('DOMContentLoaded', () => {
      google.script.run
        .withSuccessHandler(onInitialDataLoaded)
        .withFailureHandler(err => { DOM.loading.textContent = '❌ 통신 오류: ' + err.message; })
        .getInitialData();
    });

    function onInitialDataLoaded(data) {
      appConfig = data;
      populateSelect(DOM.selClass, appConfig.classList);
      populateSelect(DOM.selGroup, appConfig.groupList);
      populateSelect(DOM.selTopic, appConfig.topicList);
      DOM.loading.style.display = 'none';
    }

    function populateSelect(elem, list) {
      elem.innerHTML = '';
      list.forEach(item => {
        let opt = document.createElement('option'); opt.value = item; opt.textContent = item; elem.appendChild(opt);
      });
    }

    DOM.btnStart.addEventListener('click', () => {
      sessionData.classValue = DOM.selClass.value; sessionData.groupValue = DOM.selGroup.value; sessionData.topicValue = DOM.selTopic.value;
      DOM.hInfo.textContent = `${sessionData.classValue} ${sessionData.groupValue}`; DOM.hSub.textContent = `주제: ${sessionData.topicValue}`;
      DOM.setup.style.display = 'none'; DOM.chat.style.display = 'flex';

      totalSeconds = appConfig.timeLimitMinutes * 60;
      updateTimerDisplay();
      timerInterval = setInterval(tickTimer, 1000);

      appendMessage('ai', `환영합니다! '${sessionData.topicValue}'에 대해 어떤 가설(주장)을 세우셨나요? 관련된 근거와 함께 이야기해 봅시다.`);
    });

    function tickTimer() {
      if(isSystemLocked) return;
      totalSeconds--; updateTimerDisplay();
      if (totalSeconds <= 0) { clearInterval(timerInterval); lockChatSystem('timeout'); }
    }

    function updateTimerDisplay() {
      let m = Math.floor(totalSeconds / 60), s = totalSeconds % 60;
      DOM.timer.textContent = `⏳ ${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function lockChatSystem(reason, blockMessage) {
      isSystemLocked = true; clearInterval(timerInterval);
      DOM.input.disabled = true; DOM.btnSend.disabled = true;
      if(reason === 'timeout') {
        DOM.timer.textContent = "종료됨"; DOM.timer.style.background = "#6b7280";
        DOM.input.placeholder = "대화 시간이 종료되었습니다.";
        appendMessage('system', "⚠️ 대화 시간이 모두 종료되었습니다.\n지금까지 나눈 기록을 바탕으로 실험보고서를 작성해 주세요.");
      } else if (reason === 'blocked') {
        DOM.timer.textContent = "차단됨"; DOM.input.placeholder = "관리자에 의해 차단되었습니다.";
        appendMessage('system', blockMessage);
      }
    }

    DOM.btnSend.addEventListener('click', sendQuestion);
    DOM.input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendQuestion(); } });

    function sendQuestion() {
      const qText = DOM.input.value.trim();
      if (!qText || DOM.btnSend.disabled || isSystemLocked) return;

      appendMessage('user', qText);
      DOM.input.value = ''; DOM.input.disabled = true; DOM.btnSend.disabled = true;
      DOM.typing.style.display = 'block'; DOM.history.scrollTop = DOM.history.scrollHeight;

      const payload = {
        classValue: sessionData.classValue, groupValue: sessionData.groupValue,
        topicValue: sessionData.topicValue, userQuestion: qText, history: sessionData.history
      };

      google.script.run.withSuccessHandler(onReplySuccess).withFailureHandler(onReplyFailure).processChatMessage(payload);
    }

    function onReplySuccess(res) {
      DOM.typing.style.display = 'none';
      if (res.isBlocked) {
        lockChatSystem('blocked', res.aiReply);
      } else {
        appendMessage('ai', res.aiReply);
        DOM.input.disabled = false; DOM.btnSend.disabled = false; DOM.input.focus();
      }
    }

    function onReplyFailure(err) {
      DOM.typing.style.display = 'none'; appendMessage('system', '❌ 서버 오류: ' + err.message);
      DOM.input.disabled = false; DOM.btnSend.disabled = false;
    }

    // ★ [오류 해결 핵심] appendChild를 사용하여 말풍선이 확실하게 화면에 붙도록 수정
    function appendMessage(role, text) {
      let msgDiv = document.createElement('div');
      msgDiv.className = `msg ${role}`; msgDiv.textContent = text;
      DOM.history.appendChild(msgDiv);
      DOM.history.scrollTop = DOM.history.scrollHeight;
      if (role !== 'system') { sessionData.history.push({ role: role, text: text }); }
    }
  </script>
</body>
</html>
